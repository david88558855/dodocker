name: Mirror Docker Images

on:
  workflow_dispatch:
    inputs:
      name:
        description: '请填写Docker仓库名称，默认仓库david88558855/Docker-clone'
        required: true
        default: 'david88558855/Docker-clone'
      tag:
        description: '请填写仓库的分支或提交记录，默认主分支master'
        required: true
        default: 'master'
  workflow_run:
    workflows: ["Docker-push-x64"]
    types:
      - completed
env:
  DOCKER_REGISTRY: "${{ secrets.DOCKER_REGISTRY }}"
  DOCKER_NAME_SPACE: "${{ secrets.DOCKER_NAME_SPACE }}"
  DOCKER_REGISTRY_USER: "${{ secrets.DOCKER_REGISTRY_USER }}"
  DOCKER_REGISTRY_PASSWORD: "${{ secrets.DOCKER_REGISTRY_PASSWORD }}"

jobs:
  mirror-images:
    name: Mirror Docker Images
    runs-on: ubuntu-latest

    steps:
      # 检出仓库内容
      - name: Checkout repository
        uses: actions/checkout@v3

      # 登录到 Docker 仓库
      - name: Login to Docker Registry
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: |
          echo "${DOCKER_REGISTRY_PASSWORD}" | docker login "${DOCKER_REGISTRY}" -u "${DOCKER_REGISTRY_USER}" --password-stdin

      # 读取并处理镜像列表
      - name: Process image list
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_NAMESPACE: ${{ secrets.DOCKER_NAMESPACE }}
        run: |
          # 检查 images.txt 文件是否存在
          if [[ ! -f "images.txt" ]]; then
            echo "Error: images.txt file not found!"
            exit 1
          fi

          # 按行读取镜像列表并处理
          while IFS= read -r SOURCE_IMAGE; do
            # 忽略空行
            if [[ -z "$SOURCE_IMAGE" ]]; then
              continue
            fi

            # 构造目标镜像名称
            TARGET_IMAGE="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/$(basename "$SOURCE_IMAGE")"

            echo "========================================="
            echo "Processing source image: $SOURCE_IMAGE"
            echo "Target image: $TARGET_IMAGE"

            # 拉取源镜像，指定平台为 linux/arm64
            docker pull --platform=linux/arm64 "$SOURCE_IMAGE"

            # 重命名镜像到目标仓库
            docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

            # 推送镜像到目标仓库
            docker push "$TARGET_IMAGE"

            echo "Successfully mirrored: $SOURCE_IMAGE -> $TARGET_IMAGE"
            echo "========================================="
          done < images.txt
